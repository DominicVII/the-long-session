<!doctype html><html><body style="margin:0;background:#111"><script src="../vendor/three.min.js"></script>
<script src="onum-office-amenities.js"></script><script>
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.setSize(1200,750);document.body.appendChild(R.domElement);
R.shadowMap.enabled=true;const S=new THREE.Scene();S.background=new THREE.Color(0x1a1714);
const C=new THREE.PerspectiveCamera(50,1200/750,0.1,100);C.position.set(0,6.5,-3.5);C.lookAt(0,0,4.5);
S.add(new THREE.HemisphereLight(0xfff4e0,0x302820,0.7));const L=new THREE.DirectionalLight(0xffe8c8,0.8);L.position.set(3,6,2);L.castShadow=true;S.add(L);
const room=new THREE.Group();S.add(room);const hw=3.5,d=8;
const fl=new THREE.Mesh(new THREE.PlaneGeometry(7,8),new THREE.MeshStandardMaterial({color:0x5a4636}));fl.rotation.x=-Math.PI/2;fl.position.z=4;fl.receiveShadow=true;room.add(fl);
const wm=new THREE.MeshStandardMaterial({color:0xb8ad98});[[0,1.5,d,7,3,.1],[-hw,1.5,4,.1,3,8],[hw,1.5,4,.1,3,8]].forEach(a=>{const m=new THREE.Mesh(new THREE.BoxGeometry(a[3],a[4],a[5]),wm);m.position.set(a[0],a[1],a[2]);room.add(m);});
const door=new THREE.Mesh(new THREE.BoxGeometry(1,2.1,.1),new THREE.MeshStandardMaterial({color:0x8a2f36}));door.position.set(1.5,1.05,0);room.add(door);
window.RES=addOfficeAmenities(THREE,room,{bounds:{minX:-hw,maxX:hw,minZ:0,maxZ:d,floorY:0},doorPos:{x:1.5,z:0},seed:7});
R.render(S,C);window.DONE=RES.map(r=>r.kind+'@'+r.pos.x.toFixed(2)+','+r.pos.z.toFixed(2)+' r'+r.radius).join(' | ');
</script></body></html>
