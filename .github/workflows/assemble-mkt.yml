name: assemble-mkt
on:
  push:
    branches: [jupiter-nov24-storefronts]
    paths:
      - "build/n25mkt/go.txt"
permissions:
  contents: write
jobs:
  assemble:
    if: github.ref == 'refs/heads/jupiter-nov24-storefronts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jupiter-nov24-storefronts
          fetch-depth: 0
      - name: Who commits
        run: |
          git config user.name DominicVII
          git config user.email DominicVII@users.noreply.github.com
      - name: Apply the session.html patch, check the hash, copy the mirrors, remove the parts and this workflow
        run: |
          if [ -f build/n25mkt/session.html.patch ]; then
            bash build/n25mkt/assemble.sh
            git rm -f .github/workflows/assemble-mkt.yml
            git add session.html index.html "One Nation, Under, ME.html" public/session.html
            git commit -m "20261124g (storefronts): assemble playable HTML from hash-checked ONUM.market patch; remove temporary workflow"
          fi
      - name: Push
        run: git push origin HEAD:jupiter-nov24-storefronts
