name: assemble-r3
on:
  push:
    branches: [jupiter-nov24-r3]
    paths:
      - "build/n24c/go.txt"
      - "build/n24c/merge.txt"
permissions:
  contents: write
jobs:
  assemble:
    if: github.ref == 'refs/heads/jupiter-nov24-r3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jupiter-nov24-r3
          fetch-depth: 0
      - name: Who commits
        run: |
          git config user.name DominicVII
          git config user.email DominicVII@users.noreply.github.com
      - name: Assemble session.html from parts and check the hashes, when parts are there
        run: |
          if [ -f build/n24c/manifest.txt ]; then
            bash build/n24c/assemble.sh
            git add session.html index.html "One Nation, Under, ME.html" public/session.html
            git commit -m "20261124c: assemble the playable HTML from hash-checked parts; remove the parts"
          fi
      - name: Push
        run: git push origin HEAD:jupiter-nov24-r3
