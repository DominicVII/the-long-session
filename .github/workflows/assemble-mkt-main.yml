name: assemble-mkt-main
on:
  push:
    branches: [jupiter-nov25-storefronts-on-main]
    paths:
      - "build/n25mktmain/go.txt"
permissions:
  contents: write
jobs:
  assemble:
    if: github.ref == 'refs/heads/jupiter-nov25-storefronts-on-main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jupiter-nov25-storefronts-on-main
          fetch-depth: 0
      - name: Who commits
        run: |
          git config user.name DominicVII
          git config user.email DominicVII@users.noreply.github.com
      - name: Apply the session.html patch, check the hash, copy the mirrors, remove the parts and this workflow
        run: |
          if [ -f build/n25mktmain/session.html.patch ]; then
            bash build/n25mktmain/assemble.sh
            git rm -f .github/workflows/assemble-mkt-main.yml
            git add session.html index.html "One Nation, Under, ME.html" public/session.html
            git commit -m "20261125j1 (storefronts-on-main): assemble playable HTML from hash-checked patch; remove temporary workflow"
          fi
      - name: Push
        run: git push origin HEAD:jupiter-nov25-storefronts-on-main
