name: assemble-onum
on:
  workflow_dispatch:
  push:
    branches: [jupiter-ap-backup-20261103]
    paths:
      - '.github/workflows/assemble-onum.yml'
      - '.tmp-assemble/**'
permissions:
  contents: write
jobs:
  assemble:
    if: "github.ref == 'refs/heads/jupiter-ap-backup-20261103' && github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: jupiter-ap-backup-20261103
      - name: Concatenate parts, verify hashes, write mirrors, clean up, commit
        env:
          ROOT_SHA: b8e74881f6c2f4a55576273c7fe943ef3e103b04
          PUB_SHA: 994fe922f6cca52be2fdd3d70fd8c59d3b19c7cc
        run: |
          set -euo pipefail
          cat \
            .tmp-assemble/session.html.part-00 \
            .tmp-assemble/session.html.part-01 \
            .tmp-assemble/session.html.part-02 \
            .tmp-assemble/session.html.part-03 \
            > /tmp/session.html
          got=$(git hash-object /tmp/session.html)
          echo "root assembled $got (want $ROOT_SHA)"
          test "$got" = "$ROOT_SHA"

          cat \
            .tmp-assemble/public-session.html.part-00 \
            .tmp-assemble/public-session.html.part-01 \
            .tmp-assemble/public-session.html.part-02 \
            .tmp-assemble/public-session.html.part-03 \
            > /tmp/public-session.html
          got=$(git hash-object /tmp/public-session.html)
          echo "public assembled $got (want $PUB_SHA)"
          test "$got" = "$PUB_SHA"

          cp /tmp/session.html session.html
          cp /tmp/session.html index.html
          cp /tmp/session.html "One Nation, Under, ME.html"
          cp /tmp/session.html session.standalone.html
          cp /tmp/public-session.html public/session.html

          rm -rf .tmp-assemble
          rm -f .github/workflows/assemble-onum.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "JUPITER ap degrain handoff notes (local 5e4eee7 tree republish, SSAO on au)"
          git push origin HEAD:jupiter-ap-backup-20261103
