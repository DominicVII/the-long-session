name: assemble-onum
on:
  workflow_dispatch:
  push:
    branches: [jupiter-bv-bu-bw-bx-by-on-63a6ea4]
    paths:
      - '.github/workflows/assemble-onum.yml'
      - '.tmp-assemble/**'
permissions:
  contents: write
jobs:
  assemble:
    if: "github.ref == 'refs/heads/jupiter-bv-bu-bw-bx-by-on-63a6ea4' && github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: jupiter-bv-bu-bw-bx-by-on-63a6ea4
      - name: Concatenate parts, verify hashes, write mirrors, clean up, commit
        env:
          ROOT_SHA: f441c34a1274d66613b580d5c343c67ecc3d96b2
          PUB_SHA: 1b54f6609dee0a2a83d3be6fe1b8e9f9776b3afa
        run: |
          set -euo pipefail
          cp .tmp-assemble/commit-msg.txt /tmp/commit-msg.txt
          cat \
            .tmp-assemble/session.html.part-00 \
            .tmp-assemble/session.html.part-01 \
            .tmp-assemble/session.html.part-02 \
            .tmp-assemble/session.html.part-03 \
            > /tmp/session.html
          got=$(git hash-object /tmp/session.html)
          echo "root assembled $got (want $ROOT_SHA)"
          test "$got" = "$ROOT_SHA"

          cat \
            .tmp-assemble/public-session.html.part-00 \
            .tmp-assemble/public-session.html.part-01 \
            .tmp-assemble/public-session.html.part-02 \
            .tmp-assemble/public-session.html.part-03 \
            > /tmp/public-session.html
          got=$(git hash-object /tmp/public-session.html)
          echo "public assembled $got (want $PUB_SHA)"
          test "$got" = "$PUB_SHA"

          cp /tmp/session.html session.html
          cp /tmp/session.html index.html
          cp /tmp/session.html "One Nation, Under, ME.html"
          cp /tmp/session.html "One Nation, Under, ME..html"
          cp /tmp/session.html session.standalone.html
          cp /tmp/public-session.html public/session.html

          rm -rf .tmp-assemble
          rm -f .github/workflows/assemble-onum.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -F /tmp/commit-msg.txt
          git push origin HEAD:jupiter-bv-bu-bw-bx-by-on-63a6ea4
