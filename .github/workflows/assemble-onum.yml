name: assemble-onum
on:
  workflow_dispatch:
  push:
    branches: [jupiter-ay-on-bb-mirrors]
    paths:
      - '.github/workflows/assemble-onum.yml'
      - '.tmp-assemble/**'
permissions:
  contents: write
jobs:
  assemble:
    if: "github.ref == 'refs/heads/jupiter-ay-on-bb-mirrors' && github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: jupiter-ay-on-bb-mirrors
      - name: Concatenate parts, verify hashes, write mirrors, clean up, commit
        env:
          ROOT_SHA: 4b05cf96afa39f002246018ca5d13d3f91148fd8
          PUB_SHA: 8f188c8abb5ef21fe983c18f8e79b8011b1802da
        run: |
          set -euo pipefail
          cat \
            .tmp-assemble/session.html.part-00 \
            .tmp-assemble/session.html.part-01 \
            .tmp-assemble/session.html.part-02 \
            .tmp-assemble/session.html.part-03 \
            > /tmp/session.html
          got=$(git hash-object /tmp/session.html)
          echo "root assembled $got (want $ROOT_SHA)"
          test "$got" = "$ROOT_SHA"

          cat \
            .tmp-assemble/public-session.html.part-00 \
            .tmp-assemble/public-session.html.part-01 \
            .tmp-assemble/public-session.html.part-02 \
            .tmp-assemble/public-session.html.part-03 \
            > /tmp/public-session.html
          got=$(git hash-object /tmp/public-session.html)
          echo "public assembled $got (want $PUB_SHA)"
          test "$got" = "$PUB_SHA"

          cp /tmp/session.html session.html
          cp /tmp/session.html index.html
          cp /tmp/session.html "One Nation, Under, ME.html"
          cp /tmp/session.html "One Nation, Under, ME..html"
          cp /tmp/session.html session.standalone.html
          cp /tmp/public-session.html public/session.html

          rm -rf .tmp-assemble
          rm -f .github/workflows/assemble-onum.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "JUPITER ay: HTML mirrors on bb tip (local b3f8009 tree republish)"
          git push origin HEAD:jupiter-ay-on-bb-mirrors
