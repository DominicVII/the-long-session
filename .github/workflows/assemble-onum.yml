name: assemble-onum
on:
  workflow_dispatch:
  push:
    branches: [neptune-cafit-on-2fbf860]
    paths:
      - '.github/workflows/assemble-onum.yml'
      - 'collab/cafit-20261117n/**'
permissions:
  contents: write
jobs:
  assemble:
    if: "github.ref == 'refs/heads/neptune-cafit-on-2fbf860' && github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: neptune-cafit-on-2fbf860
          persist-credentials: true
      - name: Concatenate parts, verify hashes, write mirrors, then remove staging
        env:
          ROOT_SHA: 58359cb5eaa1e68ecab80a1cdeda4f614229c3fd
        run: |
          set -euo pipefail
          cat \
            collab/cafit-20261117n/session.html.part00 \
            collab/cafit-20261117n/session.html.part01 \
            collab/cafit-20261117n/session.html.part02 \
            > /tmp/session.html
          got=$(git hash-object /tmp/session.html)
          echo "assembled $got (want $ROOT_SHA)"
          test "$got" = "$ROOT_SHA"

          cp /tmp/session.html session.html
          cp /tmp/session.html index.html
          cp /tmp/session.html "One Nation, Under, ME.html"
          mkdir -p public
          cp /tmp/session.html public/session.html

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add session.html index.html "One Nation, Under, ME.html" public/session.html
          git status
          git commit -m "Assemble 20261117n HTML mirrors from caFit parts."
          git push origin HEAD:neptune-cafit-on-2fbf860

          rm -rf collab/cafit-20261117n
          rm -f .github/workflows/assemble-onum.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git add -A
          git status
          git commit -m "Remove caFit assemble staging and workflow."
          git push origin HEAD:neptune-cafit-on-2fbf860
