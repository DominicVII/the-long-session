name: assemble-20260928a
on:
  workflow_dispatch:
  push:
    paths:
      - "build/onum-28a.part*.b64"
      - "build/onum-28a.manifest.json"
      - ".github/workflows/assemble-28a.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble HTML
        run: bash build/assemble-28a.sh
      - name: Commit playable HTML
        run: |
          git config user.name DominicVII
          git config user.email 318079878+DominicVII@users.noreply.github.com
          git add session.html index.html "One Nation, Under, ME.html" session.standalone.html public/session.html
          if git diff --cached --quiet; then echo nothing; exit 0; fi
          git commit -m "20260928a: assemble stream-drip warmAhead HTML from parts"
          git push
