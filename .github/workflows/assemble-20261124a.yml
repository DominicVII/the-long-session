name: assemble-20261124a
on:
  workflow_dispatch:
  push:
    branches: [jupiter-nov24-on-main]
    paths:
      - "build/n24/go.txt"
permissions:
  contents: write
jobs:
  assemble:
    if: github.ref == 'refs/heads/jupiter-nov24-on-main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jupiter-nov24-on-main
      - name: Assemble the HTML from parts and check the hashes
        run: bash build/n24/assemble.sh
      - name: Commit the HTML and remove the parts and this workflow
        run: |
          git config user.name DominicVII
          git config user.email DominicVII@users.noreply.github.com
          git add session.html index.html "One Nation, Under, ME.html" public/session.html session.standalone.html "One Nation, Under, ME..html"
          git commit -m "20261124a: assemble the playable HTML from hash-checked parts; remove the parts and the assemble workflow"
          git push origin HEAD:jupiter-nov24-on-main
