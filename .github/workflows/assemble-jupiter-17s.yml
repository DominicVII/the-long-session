name: assemble-jupiter-17s
on:
  workflow_dispatch:
  push:
    branches: [jupiter-nov17-s-on-q]
    paths:
      - '.github/workflows/assemble-jupiter-17s.yml'
permissions:
  contents: write
jobs:
  assemble:
    if: "github.ref == 'refs/heads/jupiter-nov17-s-on-q' && github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: jupiter-nov17-s-on-q
          persist-credentials: true
      - name: Concatenate parts, verify the blob hash, write the four mirrors, then remove staging
        env:
          WANT: 0912a84e8395722637fae48cc2c6af0c3fe5c582
        run: |
          set -euo pipefail
          D=collab/jupiter-20261117s
          test "$(git hash-object $D/session.html.part00)" = c100cc9876d54c4da192eff6cafa6fadecb8c14f
          test "$(git hash-object $D/session.html.part01)" = 23b4b9ce01026bd0155fe39c9d19cd00ed98bb8a
          test "$(git hash-object $D/session.html.part02)" = c44ec2eff4404b025450f6fed0bcedc936725859
          cat $D/session.html.part00 $D/session.html.part01 $D/session.html.part02 > /tmp/session.html
          got=$(git hash-object /tmp/session.html)
          echo "assembled $got (want $WANT)"
          test "$got" = "$WANT"
          cp /tmp/session.html session.html
          cp /tmp/session.html index.html
          cp /tmp/session.html "One Nation, Under, ME.html"
          mkdir -p public
          cp /tmp/session.html public/session.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add session.html index.html "One Nation, Under, ME.html" public/session.html
          git commit -m "Assemble the 20261117s HTML mirrors (session, index, One Nation, public)."
          git rm -r -q $D .github/workflows/assemble-jupiter-17s.yml
          git commit -m "Remove the 20261117s staging parts and the assemble workflow."
          git push origin HEAD:jupiter-nov17-s-on-q
