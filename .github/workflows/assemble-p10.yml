name: assemble-p10
on:
  push:
    branches: [jupiter-nov24-combined]
    paths:
      - "build/n25n2/go.txt"
permissions:
  contents: write
jobs:
  assemble:
    if: github.ref == 'refs/heads/jupiter-nov24-combined'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jupiter-nov24-combined
          fetch-depth: 0
      - name: Who commits
        run: |
          git config user.name DominicVII
          git config user.email DominicVII@users.noreply.github.com
      - name: Apply the session.html patch, check the hash, copy the mirrors, remove the parts and this workflow
        run: |
          if [ -f build/n25n2/session.html.patch ]; then
            bash build/n25n2/assemble.sh
            git rm -f .github/workflows/assemble-p10.yml
            git add session.html index.html "One Nation, Under, ME.html" public/session.html
            git commit -m "20261125n2: assemble the playable HTML from the hash-checked patch 10; remove the temporary workflow"
          fi
      - name: Push
        run: git push origin HEAD:jupiter-nov24-combined
