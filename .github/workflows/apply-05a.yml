name: assemble-and-run-05a
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode patch parts and apply
        run: |
          set -euo pipefail
          : > /tmp/onum-05a.patch
          for f in $(ls build/onum-05a.patch.p*.b64 2>/dev/null | sort -V); do
            base64 -d "$f" >> /tmp/onum-05a.patch
          done
          wc -c /tmp/onum-05a.patch
          if grep -q 'content="20261005a"' session.html; then
            echo already 20261005a
          else
            if ! grep -q 'content="20261001b"' session.html; then
              echo expected 20261001b; exit 1
            fi
            patch -p1 < /tmp/onum-05a.patch
          fi
          cp session.html index.html
          cp session.html "One Nation, Under, ME.html"
          cp session.html session.standalone.html
          cp session.html public/session.html
          test "$(md5sum session.html index.html public/session.html session.standalone.html | awk '{print $1}' | sort -u | wc -l)" = "1"
          grep -q 'content="20261005a"' session.html
          grep -q 'crowdFreezeMesh' session.html
          grep -q 'BasicShadowMap' session.html
          grep -q '20261005a' src/lib/onum-build.ts || sed -i 's/20261001b/20261005a/g' src/lib/onum-build.ts
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "DominicVII"
          git config user.email "318079878+DominicVII@users.noreply.github.com"
          git add session.html index.html "One Nation, Under, ME.html" session.standalone.html public/session.html src/lib/onum-build.ts
          if git diff --cached --quiet; then echo nothing; else
            git commit -m "$(cat <<'EOF'
20261005a: weekly MAX OPTIMIZE + design/max-fit

Deep crowd freeze, Best BasicShadowMap, walk light throttle.
Shell fills big desks; kit cap KEEP 6/8; Caesar/parting polish.
Walk 0.68 / sprint 1.15. Full meshes near. KEEP intact.
EOF
)"
            git push
          fi
