name: assemble-n25
on:
  push:
    branches: [neptune-nov25-institutions]
    paths:
      - "build/n25n/go.txt"
permissions:
  contents: write
jobs:
  assemble:
    if: github.ref == 'refs/heads/neptune-nov25-institutions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: neptune-nov25-institutions
          fetch-depth: 0
      - name: Who commits
        run: |
          git config user.name DominicVII
          git config user.email DominicVII@users.noreply.github.com
      - name: Apply the session.html patch, check the hash, copy the mirrors, when the parts are there
        run: |
          if [ -f build/n25n/session.html.patch ]; then
            bash build/n25n/assemble.sh
            git add session.html index.html "One Nation, Under, ME.html" public/session.html
            git commit -m "20261125n: assemble the playable HTML from the hash-checked patch; remove the parts"
          fi
      - name: Push
        run: git push origin HEAD:neptune-nov25-institutions
