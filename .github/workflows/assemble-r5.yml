name: assemble-r5
on:
  push:
    branches: [jupiter-nov24-r5]
    paths:
      - "build/n24e/go.txt"
permissions:
  contents: write
jobs:
  assemble:
    if: github.ref == 'refs/heads/jupiter-nov24-r5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jupiter-nov24-r5
          fetch-depth: 0
      - name: Who commits
        run: |
          git config user.name DominicVII
          git config user.email DominicVII@users.noreply.github.com
      - name: Apply the session.html patch, check the hash, copy the mirrors, when the parts are there
        run: |
          if [ -f build/n24e/session.html.patch ]; then
            bash build/n24e/assemble.sh
            git add session.html index.html "One Nation, Under, ME.html" public/session.html
            git commit -m "20261124e: assemble the playable HTML from the hash-checked patch; remove the parts"
          fi
      - name: Push
        run: git push origin HEAD:jupiter-nov24-r5
