name: assemble-r2
on:
  push:
    branches: [jupiter-nov24-r2]
    paths:
      - "build/n24b/go.txt"
      - "build/n24b/merge.txt"
permissions:
  contents: write
jobs:
  assemble:
    if: github.ref == 'refs/heads/jupiter-nov24-r2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jupiter-nov24-r2
          fetch-depth: 0
      - name: Who commits
        run: |
          git config user.name DominicVII
          git config user.email DominicVII@users.noreply.github.com
      - name: Bring main in (a plain merge, never a force push), when asked
        run: |
          if [ -f build/n24b/merge.txt ]; then
            git merge --no-edit -m "Merge main (eddf58e, PR #5) into jupiter-nov24-r2 so it lands as a fast-forward" origin/main
            git rm -q build/n24b/merge.txt
            git commit -m "20261124b: remove the merge marker"
          fi
      - name: Assemble session.html from parts and check the hashes, when parts are there
        run: |
          if [ -f build/n24b/manifest.txt ]; then
            bash build/n24b/assemble.sh
            git add session.html index.html "One Nation, Under, ME.html" public/session.html
            git commit -m "20261124b: assemble the playable HTML from hash-checked parts; remove the parts"
          fi
      - name: Push
        run: git push origin HEAD:jupiter-nov24-r2
