name: assemble-20260921e
on:
  workflow_dispatch:
  push:
    paths:
      - "build/onum-e.part*.b64"
      - "build/onum-e.manifest.json"
      - ".github/workflows/assemble-e.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble HTML
        run: bash build/assemble-e.sh
      - name: Commit playable HTML
        run: |
          git config user.name DominicVII
          git config user.email 318079878+DominicVII@users.noreply.github.com
          git add session.html index.html "One Nation, Under, ME.html" session.standalone.html
          if git diff --cached --quiet; then echo nothing; exit 0; fi
          git commit -m "20260921e: assemble walk-freeze HTML from parts"
          git push
