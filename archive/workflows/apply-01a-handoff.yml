name: apply-01a-handoff-stamp
on:
  workflow_dispatch:
  push:
    paths:
      - "build/handoff-01a.patch.b64"
      - ".github/workflows/apply-01a-handoff.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch GROKBOT-HANDOFF stamp to 20261001a
        run: |
          set -euo pipefail
          if grep -q '20261001a' GROKBOT-HANDOFF.md; then echo already; exit 0; fi
          base64 -d build/handoff-01a.patch.b64 > /tmp/ho.patch
          patch -p1 < /tmp/ho.patch
          grep -q '20261001a' GROKBOT-HANDOFF.md
          git config user.name DominicVII
          git config user.email 318079878+DominicVII@users.noreply.github.com
          git add GROKBOT-HANDOFF.md
          git commit -m "20261001a: handoff stamp + warmAhead/budget notes"
          git push
