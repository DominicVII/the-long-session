name: apply-20261005a-docs
on:
  workflow_dispatch:
  push:
    paths:
      - "build/onum-05a.docs.trigger"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode handoff + changelog
        run: |
          set -euo pipefail
          : > /tmp/h.b64
          for f in $(ls build/onum-05a.handoff.b64.p* 2>/dev/null | sort -V); do tr -d '\n' < "$f" >> /tmp/h.b64; done
          : > /tmp/c.b64
          for f in $(ls build/onum-05a.changelog.b64.p* 2>/dev/null | sort -V); do tr -d '\n' < "$f" >> /tmp/c.b64; done
          test -s /tmp/h.b64
          test -s /tmp/c.b64
          base64 -d /tmp/h.b64 > GROKBOT-HANDOFF.md
          base64 -d /tmp/c.b64 > CHANGELOG.md
          grep -q '20261005a' GROKBOT-HANDOFF.md
          grep -q '20261005a' CHANGELOG.md
          git config user.name "DominicVII"
          git config user.email "318079878+DominicVII@users.noreply.github.com"
          git add GROKBOT-HANDOFF.md CHANGELOG.md
          if git diff --cached --quiet; then echo nothing; else
            git commit -m "20261005a: handoff + changelog"
            git push
          fi
