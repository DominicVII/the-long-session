name: restore-session-if-stub
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-session.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore playable HTML if stub
        run: |
          SIZE=$(wc -c < session.html || echo 0)
          echo "session.html size=$SIZE"
          if [ "$SIZE" -lt 1000 ]; then
            echo "Restoring session.html from 8be3324"
            git show 8be3324eea125947c83f8eb64b283934c8c58259:session.html > session.html
            cp session.html index.html
            cp session.html "One Nation, Under, ME.html"
            cp session.html session.standalone.html
            mkdir -p public
            cp session.html public/session.html
            git config user.name DominicVII
            git config user.email 318079878+DominicVII@users.noreply.github.com
            git add session.html index.html "One Nation, Under, ME.html" session.standalone.html public/session.html
            git commit -m "emergency: restore session.html from 8be3324 (stub was 32 bytes)"
            git push
          else
            echo "session.html already looks whole; leave it"
          fi
