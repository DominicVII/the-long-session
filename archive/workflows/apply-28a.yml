name: apply-20260928a-patch
on:
  workflow_dispatch:
  push:
    paths:
      - "build/onum-28a.patch.b64"
      - ".github/workflows/apply-28a.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 20260928a patch onto session.html
        run: |
          set -euo pipefail
          if grep -q 'content="20260928a"' session.html; then
            echo already 20260928a
            exit 0
          fi
          base64 -d build/onum-28a.patch.b64 > /tmp/onum-28a.patch
          patch -p0 < /tmp/onum-28a.patch
          mkdir -p public
          cp session.html index.html
          cp session.html "One Nation, Under, ME.html"
          cp session.html session.standalone.html
          cp session.html public/session.html
          git config user.name DominicVII
          git config user.email 318079878+DominicVII@users.noreply.github.com
          git add session.html index.html "One Nation, Under, ME.html" session.standalone.html public/session.html
          git commit -m "20260928a: stream-drip warmAhead — shell while walking, furnish while standing"
          git push
