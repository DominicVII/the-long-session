name: decode-28a-docs
on:
  workflow_dispatch:
  push:
    paths:
      - "build/CHANGELOG.md.b64"
      - "build/GROKBOT-HANDOFF.md.b64"
      - "build/GROKBOT-HANDOFF.md.b64.part1"
      - "build/GROKBOT-HANDOFF.md.b64.part2"
      - ".github/workflows/decode-28a-docs.yml"
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode docs
        run: |
          set -euo pipefail
          base64 -d build/CHANGELOG.md.b64 > CHANGELOG.md
          if [ -f build/GROKBOT-HANDOFF.md.b64.part1 ] && [ -f build/GROKBOT-HANDOFF.md.b64.part2 ]; then
            tr -d '\n' < build/GROKBOT-HANDOFF.md.b64.part1 > /tmp/ho.b64
            tr -d '\n' < build/GROKBOT-HANDOFF.md.b64.part2 >> /tmp/ho.b64
            base64 -d /tmp/ho.b64 > GROKBOT-HANDOFF.md
          else
            base64 -d build/GROKBOT-HANDOFF.md.b64 > GROKBOT-HANDOFF.md
          fi
          git config user.name DominicVII
          git config user.email 318079878+DominicVII@users.noreply.github.com
          git add CHANGELOG.md GROKBOT-HANDOFF.md
          if git diff --cached --quiet; then echo nothing; exit 0; fi
          git commit -m "20260928a: changelog + handoff stamp notes"
          git push
